name: Build AERA Recovery (martini / OnePlus 9RT)

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: 'Kernel workflow run id (empty = latest successful run of perf/eevdf-optimized)'
        required: false
        default: ''
      full_sync:
        description: 'Force a full repo sync'
        type: boolean
        required: false
        default: false

concurrency:
  group: aera-martini-build
  cancel-in-progress: false

env:
  AERA_TREE: /mnt/f/aera/AERA_16.0
  DEVICE: martini
  KERNEL_REPO: one899/android_kernel_oneplus_sm8350_9rt_295bpf
  KERNEL_BRANCH: perf/eevdf-optimized
  MANIFEST_URL: https://github.com/AERA-Recovery/android_manifest.git

jobs:
  build:
    runs-on: [self-hosted, linux, aera]
    timeout-minutes: 420
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: devicetree
          fetch-depth: 1

      - name: Host dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git \
            gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 mkbootimg dtc device-tree-compiler lz4 xz-utils \
            unzip file android-sdk-libsparse-utils
          command -v repo >/dev/null || {
            mkdir -p ~/bin
            curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod +x ~/bin/repo
            echo "$HOME/bin" >> $GITHUB_PATH
          }

      - name: Configure git identity
        run: |
          git config --global user.name  "AERA CI"
          git config --global user.email "ci@aera.local"
          git config --global --add safe.directory '*'

      - name: Sync AERA manifest (cached tree)
        run: |
          set -eux
          mkdir -p "$AERA_TREE"
          cd "$AERA_TREE"
          if [ ! -d .repo ] || [ "${{ inputs.full_sync }}" = "true" ]; then
            rm -rf .repo
            repo init -u "$MANIFEST_URL" -b aera-16.0
          fi
          repo sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)" --optimized-fetch

      - name: Install device tree
        run: |
          set -eux
          rm -rf "$AERA_TREE/device/oneplus/martini"
          mkdir -p "$AERA_TREE/device/oneplus"
          rsync -a --exclude .git devicetree/ "$AERA_TREE/device/oneplus/martini/"

      - name: Fetch kernel Image from kernel CI artifact
        env:
          # 跨仓库下载 artifact 需要能读内核仓库 Actions 的 token：
          # 在仓库 Secrets 里加 KERNEL_TOKEN（PAT，带 repo 或 actions:read）。
          # 未配置时退回 GITHUB_TOKEN（仅当内核仓库是本仓库同一 owner 且公开时可能可用）。
          GH_TOKEN: ${{ secrets.KERNEL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          WORK="$RUNNER_TEMP/kernel"
          rm -rf "$WORK"; mkdir -p "$WORK"
          if [ -n "${{ inputs.kernel_run_id }}" ]; then
            RUN_ID="${{ inputs.kernel_run_id }}"
          else
            RUN_ID=$(gh api "repos/${KERNEL_REPO}/actions/runs?branch=${KERNEL_BRANCH}&status=success&per_page=1" \
                     --jq '.workflow_runs[0].id')
          fi
          echo "kernel run: $RUN_ID"
          gh run download "$RUN_ID" --repo "$KERNEL_REPO" --dir "$WORK" --pattern 'noroot_9rt-BPF_Docker.img'
          BOOT=$(find "$WORK" -name 'boot-*Docker-*.img' | head -1)
          echo "boot image: $BOOT"
          python3 - "$BOOT" "$AERA_TREE/device/oneplus/martini/prebuilt/Image" <<'PY'
          import struct, sys
          src, dst = sys.argv[1], sys.argv[2]
          d = open(src, 'rb').read()
          assert d[:8] == b'ANDROID!', 'not a boot image'
          kern = struct.unpack('<I', d[8:12])[0]
          PS = 4096
          open(dst, 'wb').write(d[PS:PS+kern])
          print('extracted kernel', kern, 'bytes ->', dst)
          PY
          ls -l "$AERA_TREE/device/oneplus/martini/prebuilt/Image"

      - name: Build recovery image
        run: |
          set -eux
          cd "$AERA_TREE"
          source build/envsetup.sh
          lunch twrp_martini-bp2a-eng
          mka adbd recoveryimage -j"$(nproc)"

      - name: Collect artifacts
        run: |
          set -eux
          OUT="$AERA_TREE/out/target/product/martini"
          mkdir -p "$RUNNER_TEMP/out"
          cp -v "$OUT/recovery.img" "$RUNNER_TEMP/out/AERA-R1.0-martini-recovery.img"
          [ -f "$OUT/ramdisk-recovery.img" ] && cp -v "$OUT/ramdisk-recovery.img" "$RUNNER_TEMP/out/" || true
          python3 - "$RUNNER_TEMP/out/AERA-R1.0-martini-recovery.img" <<'PY' | tee "$RUNNER_TEMP/out/header.txt"
          import struct, sys
          d = open(sys.argv[1], 'rb').read()
          print('size        :', len(d))
          print('magic       :', d[:8])
          print('header_ver  :', struct.unpack('<I', d[40:44])[0])
          print('header_size :', struct.unpack('<I', d[20:24])[0])
          print('kernel_size :', struct.unpack('<I', d[8:12])[0])
          print('ramdisk_size:', struct.unpack('<I', d[12:16])[0])
          print('cmdline     :', repr(d[44:44+1536].split(b'\0')[0]))
          PY
          sha256sum "$RUNNER_TEMP/out/AERA-R1.0-martini-recovery.img"

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: AERA-martini-recovery
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 14
