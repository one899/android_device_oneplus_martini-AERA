name: Build AERA Recovery (martini / OnePlus 9RT)

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: 'Reuse the kernel Image artifact from this run id (empty = build kernel)'
        required: false
        default: ''
      kernel_ref:
        description: 'Kernel branch'
        required: false
        default: 'perf/eevdf-optimized'
      modules_ref:
        description: 'Modules/devicetree branch'
        required: false
        default: 'oneplus/sm8350_b_16.0.0_oneplus9rt'
      jobs:
        description: 'Parallel jobs for mka (default 4, max 8)'
        required: false
        default: '4'
      full_sync:
        description: 'Force a fresh repo init'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNEL_REPO: one899/android_kernel_oneplus_sm8350_9rt_295bpf
  MODULES_REPO: one899/android_kernel_modules_and_devicetree_oneplus_sm8350
  MANIFEST_URL: https://github.com/AERA-Recovery/android_manifest.git

jobs:
  kernel:
    if: inputs.kernel_run_id == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift || true
          sudo apt-get clean
          df -h

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ inputs.kernel_ref }}
          path: kernel/msm-5.4
          fetch-depth: 1

      - name: Checkout modules/devicetree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MODULES_REPO }}
          ref: ${{ inputs.modules_ref }}
          path: temp_modules
          fetch-depth: 1

      - name: Host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex git libelf-dev libssl-dev \
            python3 python-is-python3 cpio zstd lz4 xz-utils unzip curl patch \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu dwarves

      - name: Handle dependencies
        run: |
          mv temp_modules/vendor ./vendor
          mv temp_modules/device ./device
          rm -rf temp_modules

      - name: Fetch clang r383902
        run: |
          mkdir -p compiler && cd compiler
          curl -fL --retry 5 --connect-timeout 30 \
            "https://github.com/Rancemxn/android_kernel_oppo_sm7325/releases/download/BuildTool/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz" \
            -o clang.tar.gz
          mkdir -p clang-bin && tar -xzf clang.tar.gz -C clang-bin && rm clang.tar.gz

      - name: Build kernel (9rt_defconfig, EEVDF)
        run: |
          cd kernel/msm-5.4
          export PATH="$GITHUB_WORKSPACE/compiler/clang-bin/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CLANG_PATH="$GITHUB_WORKSPACE/compiler/clang-bin/bin"
          export ARCH="arm64"
          make O=out CC="ccache clang" LLVM=1 9rt_defconfig
          make O=out CC="ccache clang" LLVM=1 -j"$(nproc)"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/msm-5.4/out/arch/arm64/boot/Image
          if-no-files-found: error

  recovery:
    needs: [kernel]
    if: always() && !cancelled() && (inputs.kernel_run_id != '' || needs.kernel.result == 'success')
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift || true
          sudo apt-get clean
          df -h

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            python3 python3-pip rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev openjdk-11-jdk
          git lfs install --skip-repo || true
          ccache -z || true

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global color.ui false
          # AERA manifest declares the AERA remote over SSH; repos are public
          git config --global url."https://github.com/AERA-Recovery".insteadOf "ssh://git@github.com/AERA-Recovery"
          git config --global --add safe.directory '*'

      - name: Add swap (16G) and tame oomd
        run: |
          sudo systemctl stop systemd-oomd systemd-oomd.socket 2>/dev/null || true
          sudo systemctl disable systemd-oomd systemd-oomd.socket 2>/dev/null || true
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile /home/swapfile || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -m
          df -h /

      - name: Repo init and sync (AERA manifest, aera-16.0)
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/aera"
          cd "$GITHUB_WORKSPACE/aera"
          if [ ! -d .repo ] || [ "${{ inputs.full_sync }}" = "true" ]; then
            repo init -u "$MANIFEST_URL" -b aera-16.0 --git-lfs --depth=1
          fi
          repo sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc --all)"
          df -h .
          du -sh .

      - name: Drop the repo object store
        run: |
          cd "$GITHUB_WORKSPACE/aera"
          echo "--- before ---"; du -sh .repo 2>/dev/null || true; df -h .
          rm -rf .repo
          echo "--- after ---"; df -h .

      - name: Apply upstream source fixes
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/aera"
          # AERA's partitionmanager.cpp references AID_MEDIA_RW without the
          # header that declares it (data.cpp / twrp-functions.cpp both include it).
          f=bootable/recovery/partitionmanager.cpp
          if [ -f "$f" ] && ! grep -q 'android_filesystem_config.h' "$f"; then
            sed -i '0,/^#include <fstab\/fstab.h>/s//#include <private\/android_filesystem_config.h>\n#include <fstab\/fstab.h>/' "$f"
            grep -n 'android_filesystem_config.h' "$f"
          fi
          # rclone_prebuilt (a full Go program) and fusermount3 are NAS-only deps,
          # several GB of build time and disk we do not need for recovery.
          mk=bootable/recovery/aera_build.mk
          if [ -f "$mk" ] && grep -q 'rclone_prebuilt' "$mk"; then
            sed -i '/^[[:space:]]*rclone_prebuilt[[:space:]]*\\$/d' "$mk"
            sed -i '/^[[:space:]]*fusermount3[[:space:]]*$/d' "$mk"
            sed -i 's/^\([[:space:]]*dhcptool\)[[:space:]]*\\$/\1/' "$mk"
            grep -nE 'rclone_prebuilt|fusermount3|dhcptool' "$mk" || true
          fi
          df -h .

      - name: Install device tree
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/aera"
          rm -rf device/oneplus/martini
          mkdir -p device/oneplus
          cp -a "$GITHUB_WORKSPACE/device_tree" device/oneplus/martini
          rm -rf device/oneplus/martini/.github device/oneplus/martini/.git
          ls device/oneplus/martini

      - name: Install kernel Image
        uses: actions/download-artifact@v4
        with:
          name: kernel-image
          path: ${{ github.workspace }}/aera/device/oneplus/martini/prebuilt
          run-id: ${{ inputs.kernel_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Image
        run: |
          set -eux
          ls -l aera/device/oneplus/martini/prebuilt/
          python3 - aera/device/oneplus/martini/prebuilt/Image <<'PY'
          import struct, sys
          d = open(sys.argv[1],'rb').read()
          m = struct.unpack('<Q', d[56:64])[0] & 0xffffffff
          print("Image size:", len(d), "arm64 magic: 0x%x (expect 0x644d5241)" % m)
          PY

      - name: Build recovery
        env:
          JOBS_INPUT: ${{ github.event.inputs.jobs }}
        run: |
          set -ex
          cd "$GITHUB_WORKSPACE/aera"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export TMPDIR="$GITHUB_WORKSPACE/tmp"
          mkdir -p "$TMPDIR"
          jobs="${JOBS_INPUT:-4}"
          df -h .
          free -m
          source build/envsetup.sh
          lunch twrp_martini-bp2a-eng
          mka adbd recoveryimage -j"$jobs" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          df -h .

      - name: Collect
        run: |
          set -eux
          OUT="$GITHUB_WORKSPACE/aera/out/target/product/martini"
          mkdir -p "$RUNNER_TEMP/out"
          cp -v "$OUT/recovery.img" "$RUNNER_TEMP/out/AERA-R1.0-martini-recovery.img"
          python3 - "$RUNNER_TEMP/out/AERA-R1.0-martini-recovery.img" <<'PY' | tee "$RUNNER_TEMP/out/header.txt"
          import struct, sys, hashlib
          d = open(sys.argv[1],'rb').read()
          print("file size   :", len(d))
          print("magic       :", d[:8])
          print("header_ver  :", struct.unpack('<I', d[40:44])[0])
          print("header_size :", struct.unpack('<I', d[20:24])[0])
          print("kernel_size :", struct.unpack('<I', d[8:12])[0])
          print("ramdisk_size:", struct.unpack('<I', d[12:16])[0])
          print("fits 192MiB :", len(d) <= 201326592)
          print("sha256      :", hashlib.sha256(d).hexdigest())
          PY

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: AERA-martini-recovery
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 14
