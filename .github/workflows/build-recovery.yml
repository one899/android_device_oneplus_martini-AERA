name: Build AERA Recovery (martini / OnePlus 9RT)

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: 'Reuse the kernel Image artifact from this run id (empty = build kernel)'
        required: false
        default: ''
      kernel_ref:
        description: 'Kernel branch'
        required: false
        default: 'perf/eevdf-optimized'
      modules_ref:
        description: 'Modules/devicetree branch'
        required: false
        default: 'oneplus/sm8350_b_16.0.0_oneplus9rt'
      full_sync:
        description: 'Force a fresh repo init'
        type: boolean
        required: false
        default: false

concurrency:
  group: aera-martini-build
  cancel-in-progress: false

env:
  KERNEL_REPO: one899/android_kernel_oneplus_sm8350_9rt_295bpf
  MODULES_REPO: one899/android_kernel_modules_and_devicetree_oneplus_sm8350
  MANIFEST_URL: https://github.com/AERA-Recovery/android_manifest.git
  AERA_TREE: ${{ github.workspace }}/aera

jobs:
  kernel:
    if: inputs.kernel_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ inputs.kernel_ref }}
          path: kernel/msm-5.4
          fetch-depth: 1

      - name: Checkout modules/devicetree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MODULES_REPO }}
          ref: ${{ inputs.modules_ref }}
          path: temp_modules
          fetch-depth: 1

      - name: Host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex git libelf-dev libssl-dev \
            python3 python-is-python3 cpio zstd lz4 xz-utils unzip curl patch \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu dwarves

      - name: Handle dependencies
        run: |
          set -eux
          mv temp_modules/vendor ./vendor
          mv temp_modules/device ./device
          rm -rf temp_modules

      - name: Fetch clang r383902
        run: |
          set -eux
          mkdir -p compiler && cd compiler
          curl -fL --retry 5 --connect-timeout 30 \
            "https://github.com/Rancemxn/android_kernel_oppo_sm7325/releases/download/BuildTool/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz" \
            -o clang.tar.gz
          mkdir -p clang-bin && tar -xzf clang.tar.gz -C clang-bin && rm clang.tar.gz
          ls clang-bin/bin/clang

      - name: rekernel patches (best effort)
        continue-on-error: true
        run: |
          cd kernel/msm-5.4
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_patches.sh" -o rekernel_patches.sh || true
          chmod +x rekernel_patches.sh || true
          bash rekernel_patches.sh || true
          mkdir -p drivers/rekernel
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_extra.patch" -o rekernel_extra.patch || true
          patch -p1 < rekernel_extra.patch || true

      - name: Build kernel (9rt_defconfig, EEVDF)
        run: |
          set -eux
          cd kernel/msm-5.4
          export PATH="$GITHUB_WORKSPACE/compiler/clang-bin/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_COMPILERCHECK=content
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CLANG_PATH="$GITHUB_WORKSPACE/compiler/clang-bin/bin"
          export ARCH="arm64"
          ccache --max-size=2G || true
          make O=out CC="ccache clang" LLVM=1 9rt_defconfig
          make O=out CC="ccache clang" LLVM=1 -j"$(nproc)"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/msm-5.4/out/arch/arm64/boot/Image
          if-no-files-found: error

  recovery:
    needs: [kernel]
    if: always() && !cancelled() && (inputs.kernel_run_id != '' || needs.kernel.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: devicetree
          fetch-depth: 1

      - name: Host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gnupg gperf imagemagick \
            libelf-dev libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 device-tree-compiler lz4 xz-utils unzip file
          sudo apt-get install -y --no-install-recommends \
            g++-multilib gcc-multilib libc6-dev-i386 android-sdk-libsparse-utils || true
          command -v repo >/dev/null || {
            mkdir -p ~/bin
            curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod +x ~/bin/repo
            echo "$HOME/bin" >> $GITHUB_PATH
          }
          git config --global user.name "AERA CI"
          git config --global user.email "ci@aera.local"
          git config --global --add safe.directory '*'
          df -h /

      - name: Sync AERA (shallow)
        run: |
          set -eux
          mkdir -p "$AERA_TREE"
          cd "$AERA_TREE"
          if [ ! -d .repo ] || [ "${{ inputs.full_sync }}" = "true" ]; then
            repo init -u "$MANIFEST_URL" -b aera-16.0 --depth=1
          fi
          repo sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)" --optimized-fetch
          du -sh "$AERA_TREE"
          df -h /

      - name: Install device tree
        run: |
          set -eux
          mkdir -p "$AERA_TREE/device/oneplus"
          rsync -a --exclude .git --exclude 'prebuilt/Image' devicetree/ "$AERA_TREE/device/oneplus/martini/"
          ls "$AERA_TREE/device/oneplus/martini"

      - name: Install kernel Image
        uses: actions/download-artifact@v4
        with:
          name: kernel-image
          path: ${{ env.AERA_TREE }}/device/oneplus/martini/prebuilt
          run-id: ${{ inputs.kernel_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Image
        run: |
          set -eux
          ls -l "$AERA_TREE/device/oneplus/martini/prebuilt/"
          python3 - "$AERA_TREE/device/oneplus/martini/prebuilt/Image" <<'PY'
          import struct, sys
          p = sys.argv[1]
          d = open(p,'rb').read()
          print("kernel size:", len(d), "magic:", d[:4].hex())
          m = struct.unpack('<Q', d[56:64])[0] & 0xffffffff
          print("arm64 Image magic: 0x%x (expect 0x644d5241)" % m)
          PY

      - name: Build recovery
        run: |
          set -eux
          cd "$AERA_TREE"
          source build/envsetup.sh
          lunch twrp_martini-bp2a-eng
          mka adbd recoveryimage -j"$(nproc)"
          df -h /

      - name: Collect
        run: |
          set -eux
          OUT="$AERA_TREE/out/target/product/martini"
          mkdir -p "$RUNNER_TEMP/out"
          cp -v "$OUT/recovery.img" "$RUNNER_TEMP/out/AERA-R1.0-martini-recovery.img"
          python3 - "$RUNNER_TEMP/out/AERA-R1.0-martini-recovery.img" <<'PY' | tee "$RUNNER_TEMP/out/header.txt"
          import struct, sys
          d = open(sys.argv[1],'rb').read()
          print("file size   :", len(d))
          print("magic       :", d[:8])
          print("header_ver  :", struct.unpack('<I', d[40:44])[0])
          print("header_size :", struct.unpack('<I', d[20:24])[0])
          print("kernel_size :", struct.unpack('<I', d[8:12])[0])
          print("ramdisk_size:", struct.unpack('<I', d[12:16])[0])
          print("fits 192MiB :", len(d) <= 201326592)
          PY
          sha256sum "$RUNNER_TEMP/out/AERA-R1.0-martini-recovery.img"

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: AERA-martini-recovery
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 14
